<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard — Help Desk</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🎧 Help Desk</a>
      <div class="stack">
        <span id="welcome-text" class="welcome-badge"></span>
        <button id="logout-btn" class="btn-sm btn-secondary">Logout</button>
      </div>
    </div>
  </header>

  <div class="dashboard-wrap">

    <nav class="tab-nav" id="tab-nav">
      <button class="tab-btn active" data-tab="tickets">My Tickets</button>
      <button class="tab-btn" data-tab="new-ticket">New Ticket</button>
      <button class="tab-btn agent-only hidden" data-tab="all-tickets">All Tickets</button>
    </nav>

    <!-- My Tickets -->
    <section id="tab-tickets" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2>My Tickets</h2>
          <button id="refresh-tickets-btn" class="btn-sm btn-secondary">↻ Refresh</button>
        </div>
        <div id="tickets-list"><p class="muted">Loading…</p></div>
      </div>
    </section>

    <!-- New Ticket -->
    <section id="tab-new-ticket" class="tab-content hidden">
      <div class="card" style="max-width:520px;">
        <h2 style="margin-bottom:0.75rem;">Raise a ticket</h2>

        <label class="field-label">Title</label>
        <input id="nt-title" type="text" placeholder="Brief summary of the issue" />

        <label class="field-label">Description</label>
        <textarea id="nt-desc" placeholder="Describe the issue in detail…"></textarea>

        <label class="field-label">Priority</label>
        <select id="nt-priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="HIGH">High</option>
        </select>

        <button id="nt-submit" class="btn-full">Submit ticket</button>
        <p id="nt-msg" class="msg"></p>
      </div>
    </section>

    <!-- All Tickets (agent / admin) -->
    <section id="tab-all-tickets" class="tab-content hidden">
      <div class="card">
        <div class="card-header">
          <h2>All Tickets</h2>
          <button id="refresh-all-btn" class="btn-sm btn-secondary">↻ Refresh</button>
        </div>
        <div id="all-tickets-list"><p class="muted">Loading…</p></div>
      </div>
    </section>

  </div><!-- /dashboard-wrap -->

  <!-- Ticket modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="btn-sm btn-secondary">✕</button>
      </div>

      <div id="modal-meta" class="modal-meta"></div>
      <p id="modal-desc" style="margin-bottom:0.75rem; color:#374151;"></p>

      <!-- Agent actions -->
      <div id="agent-actions" class="hidden" style="margin-bottom:1rem;">
        <div>
          <select id="assign-agent-select"></select>
          <button id="assign-agent-btn" class="btn-sm">Assign agent</button>
          <select id="status-select">
            <option value="OPEN">OPEN</option>
            <option value="IN_PROGRESS">IN PROGRESS</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="CLOSED">CLOSED</option>
          </select>
          <button id="update-status-btn" class="btn-sm">Update status</button>
        </div>
        <p id="agent-action-msg" class="msg"></p>
      </div>

      <!-- Admin delete -->
      <div id="admin-delete" class="hidden" style="margin-bottom:1rem;">
        <button id="delete-ticket-btn" class="btn-sm btn-danger">Delete ticket</button>
        <p id="delete-msg" class="msg"></p>
      </div>

      <div class="divider"></div>

      <h3 style="font-size:0.95rem; margin-bottom:0.6rem;">Comments</h3>
      <div id="comments-list"></div>
      <textarea id="comment-body" placeholder="Write a comment…" style="height:70px; margin-top:0.5rem;"></textarea>
      <button id="post-comment-btn" class="btn-sm" style="margin-top:0.4rem;">Post comment</button>
      <p id="comment-msg" class="msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
