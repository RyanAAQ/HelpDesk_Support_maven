<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard — Help Desk</title>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="brand">🎧 Help Desk</div>
    <div class="stack">
      <span id="welcome-text" class="muted"></span>
      <button id="logout-btn">Logout</button>
    </div>
  </header>

  <!-- ── Tab nav ── -->
  <nav class="tab-nav" id="tab-nav">
    <button class="tab-btn active" data-tab="tickets">My Tickets</button>
    <button class="tab-btn" data-tab="new-ticket">New Ticket</button>
    <button class="tab-btn agent-only hidden" data-tab="all-tickets">All Tickets</button>
  </nav>

  <!-- ════════════════════════════════════════════
       TAB: My Tickets / All Tickets (shared view)
  ═══════════════════════════════════════════════ -->
  <section id="tab-tickets" class="tab-content">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 id="tickets-heading">My Tickets</h2>
        <button id="refresh-tickets-btn" class="btn-sm">↻ Refresh</button>
      </div>
      <div id="tickets-list"><p class="muted">Loading…</p></div>
    </div>
  </section>

  <!-- ════════════════════════════════════════════
       TAB: New Ticket
  ═══════════════════════════════════════════════ -->
  <section id="tab-new-ticket" class="tab-content hidden">
    <div class="card" style="max-width:520px; margin-left:auto; margin-right:auto;">
      <h2 style="margin-bottom:16px;">Raise a ticket</h2>
      <label class="field-label">Title</label>
      <input id="nt-title" type="text" placeholder="Brief summary of the issue" />
      <label class="field-label">Description</label>
      <textarea id="nt-desc" placeholder="Describe the issue in detail…"></textarea>
      <label class="field-label">Priority</label>
      <select id="nt-priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM" selected>Medium</option>
        <option value="HIGH">High</option>
      </select>
      <button id="nt-submit" class="btn-full" style="margin-top:4px;">Submit ticket</button>
      <p id="nt-msg" class="msg"></p>
    </div>
  </section>

  <!-- ════════════════════════════════════════════
       TAB: All Tickets (agent / admin)
  ═══════════════════════════════════════════════ -->  <section id="tab-all-tickets" class="tab-content hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2>All Tickets</h2>
        <button id="refresh-all-btn" class="btn-sm">↻ Refresh</button>
      </div>
      <div id="all-tickets-list"><p class="muted">Loading…</p></div>
    </div>
  </section>


  <!-- ════════════════════════════════════════════
       MODAL: Ticket Detail
  ═══════════════════════════════════════════════ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
        <h2 id="modal-title" style="flex:1; margin-right:12px;"></h2>
        <button id="modal-close" class="btn-sm">✕</button>
      </div>

      <div id="modal-meta" class="modal-meta"></div>
      <p id="modal-desc" style="margin:12px 0; line-height:1.6;"></p>

      <!-- Agent: assign + status -->
      <div id="agent-actions" class="hidden" style="margin-bottom:16px;">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <select id="assign-agent-select" style="flex:1; min-width:160px; margin-bottom:0;"></select>
          <button id="assign-agent-btn" class="btn-sm">Assign agent</button>
          <select id="status-select" style="flex:1; min-width:130px; margin-bottom:0;">
            <option value="OPEN">OPEN</option>
            <option value="IN_PROGRESS">IN PROGRESS</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="CLOSED">CLOSED</option>
          </select>
          <button id="update-status-btn" class="btn-sm">Update status</button>
        </div>
        <p id="agent-action-msg" class="msg"></p>
      </div>

      <!-- Delete (admin) -->
      <div id="admin-delete" class="hidden" style="margin-bottom:16px;">
        <button id="delete-ticket-btn" class="btn-danger btn-sm">Delete ticket</button>
        <p id="delete-msg" class="msg"></p>
      </div>

      <!-- Comments -->
      <div class="divider"></div>
      <h3 style="margin:12px 0 10px;">Comments</h3>
      <div id="comments-list" style="margin-bottom:14px;"></div>
      <textarea id="comment-body" placeholder="Write a comment…" style="height:70px;"></textarea>
      <button id="post-comment-btn" class="btn-sm" style="margin-top:4px;">Post comment</button>
      <p id="comment-msg" class="msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
