<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Help Desk</title>
</head>
<body>
  <header>
    <div class="brand">🎧 Help Desk</div>
  </header>

  <main class="card" style="max-width:460px; margin:60px auto; text-align:center;">
    <h1 style="margin-bottom:8px;">Welcome</h1>
    <p class="muted" style="margin-bottom:28px;">Raise tickets, track issues, get help.</p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <a class="btn-link" href="login.html">Login</a>
      <a class="btn" href="register.html">Register</a>
    </div>
  </main>

  <script>
    // Redirect to dashboard if already logged in
    try {
      const u = localStorage.getItem('helpdesk_user');
      if (u) window.location.href = 'dashboard.html';
    } catch(_) {}
  </script>
</body>
</html>
