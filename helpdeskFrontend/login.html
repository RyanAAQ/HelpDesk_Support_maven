<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Login — Help Desk</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🎧 Help Desk</a>
      <nav class="header-nav">
        <a href="register.html">Create account</a>
        <a href="register-agent.html">Agent sign up</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="card">
      <h1>Login</h1>
      <p class="subtext">Sign in to your account.</p>

      <label class="field-label">Username</label>
      <input id="login-username" type="text" placeholder="your_username" autocomplete="username" />

      <label class="field-label">Password</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />

      <button id="login-btn" class="btn-full">Login</button>
      <p id="login-msg" class="msg"></p>

      <p class="auth-meta">No account? <a href="register.html">Sign up</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
