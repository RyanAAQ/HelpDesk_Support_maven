<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Agent Sign Up — Help Desk</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🎧 Help Desk</a>
      <nav class="header-nav">
        <a href="login.html">Login</a>
        <a href="register.html">Customer sign up</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="card">
      <h2>Agent sign up</h2>
      <p class="subtext">You will be registered as a support agent.</p>

      <label class="field-label">Username</label>
      <input id="reg-username" type="text" placeholder="agent_username" autocomplete="username" />

      <label class="field-label">Email</label>
      <input id="reg-email" type="email" placeholder="agent@example.com" autocomplete="email" />

      <label class="field-label">Password</label>
      <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" />

      <!-- role is always AGENT on this page -->
      <button id="reg-agent-btn" class="btn-full">Create agent account</button>
      <p id="reg-msg" class="msg"></p>

      <p class="auth-meta">Already have an account? <a href="login.html">Login</a></p>
      <p class="auth-meta">Not an agent? <a href="register.html">Customer sign up</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
