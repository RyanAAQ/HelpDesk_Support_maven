<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Register — Help Desk</title>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🎧 Help Desk</a>
      <nav class="header-nav">
        <a href="login.html">Login</a>
        <a href="register-agent.html">Agent sign up</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="card">
      <h2>Create account</h2>
      <p class="subtext">Customers sign up here.</p>

      <label class="field-label">Username</label>
      <input id="reg-username" type="text" placeholder="your_username" autocomplete="username" />

      <label class="field-label">Email</label>
      <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" />

      <label class="field-label">Password</label>
      <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" />

      <!-- role is always CUSTOMER on this page -->
      <button id="reg-btn" class="btn-full">Create account</button>
      <p id="reg-msg" class="msg"></p>

      <p class="auth-meta">Already have an account? <a href="login.html">Login</a></p>
      <p class="auth-meta">Support agent? <a href="register-agent.html">Agent sign up</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
